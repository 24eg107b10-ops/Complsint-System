services:
  - type: web
    name: complaint-backend
    env: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/complaint-management-0.0.1-SNAPSHOT.jar
    envVars:
      SPRING_DATASOURCE_URL: "jdbc:mysql://HOST:PORT/DATABASE?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      APP_CORS_ALLOWED_ORIGIN: "<VERCEL_FRONTEND_URL>"
