server.port=${PORT:8080}

spring.application.name=complaint-management

# Database Configuration (supports MySQL when env var is set, or embedded H2 database file)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/complaint_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Allowed Origins
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:*}
